name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -c "import sys; print('Python version:', sys.version)"
        python -c "import PyQt5; print('PyQt5 imported successfully')"
        python -c "import cv2; print('OpenCV imported successfully')"
        python -c "from pysat.solvers import Glucose3; print('PySAT imported successfully')"
        echo "Basic import tests passed"